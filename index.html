<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zema Hospitality">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex">
<title>Zema Hospitality</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. A slim rail of destinations, a top bar that says where you are and who you are,
   and one working surface. On a phone the rail becomes a bottom bar and side panels become bottom sheets. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D5DBD3; --line2:#E4E8E2;
  --ink:#131917; --ink2:#4B5651; --ink3:#7C8781;
  --accent:#0E5A4F; --on-accent:#F2F7F4; --accent-soft:#DCEAE5;
  /* table and ticket states: semantic, separate from the accent */
  --s-available:#2E8B62; --s-available-bg:#E3F1E9;
  --s-occupied:#3C4743;  --s-occupied-bg:#DDE2DE;
  --s-reserved:#5B5BB0;  --s-reserved-bg:#E6E6F5;
  --s-ordering:#A8780F;  --s-ordering-bg:#F6ECD2;
  --s-waiting:#C0601A;   --s-waiting-bg:#F8E4D3;
  --s-bill:#B4323C;      --s-bill-bg:#F7DDDF;
  --s-cleaning:#7C8781;  --s-cleaning-bg:#ECEFEB;
  --shadow:0 1px 2px rgba(19,25,23,.06),0 8px 24px rgba(19,25,23,.06);
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1211; --surface:#151B19; --sunk:#0A0E0D; --line:#27302D; --line2:#1D2523;
  --ink:#EDF2EE; --ink2:#A9B4AE; --ink3:#78847E;
  --accent:#58C2A8; --on-accent:#07201B; --accent-soft:#16302A;
  --s-available:#5CC795; --s-available-bg:#12291F;
  --s-occupied:#C4CEC8;  --s-occupied-bg:#262F2C;
  --s-reserved:#A3A3F0;  --s-reserved-bg:#1E1F3A;
  --s-ordering:#E3B549;  --s-ordering-bg:#33290E;
  --s-waiting:#F0975A;   --s-waiting-bg:#3A2212;
  --s-bill:#F0808A;      --s-bill-bg:#3B171B;
  --s-cleaning:#78847E;  --s-cleaning-bg:#1A211F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#151B19; --sunk:#0A0E0D; --line:#27302D; --line2:#1D2523;
  --ink:#EDF2EE; --ink2:#A9B4AE; --ink3:#78847E;
  --accent:#58C2A8; --on-accent:#07201B; --accent-soft:#16302A;
  --s-available:#5CC795; --s-available-bg:#12291F;
  --s-occupied:#C4CEC8;  --s-occupied-bg:#262F2C;
  --s-reserved:#A3A3F0;  --s-reserved-bg:#1E1F3A;
  --s-ordering:#E3B549;  --s-ordering-bg:#33290E;
  --s-waiting:#F0975A;   --s-waiting-bg:#3A2212;
  --s-bill:#F0808A;      --s-bill-bg:#3B171B;
  --s-cleaning:#78847E;  --s-cleaning-bg:#1A211F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*,*:before,*:after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.rail{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 16px var(--display);font-style:normal}
.brand b{font:500 16px var(--display);letter-spacing:-.01em;display:block}
.brand small{display:block;font-size:11px;color:var(--ink3);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .soon{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.rail-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:20px;margin-right:auto}
.clock{font:500 13px var(--mono);color:var(--ink2);white-space:nowrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:8px;font-weight:500;color:var(--ink2);font-size:14px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.view{flex:1;overflow:auto;padding:26px 28px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel h2{font-size:17px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .num{font-size:34px;line-height:1.05;font-weight:500}
.kpi small{font-size:12px;color:var(--ink3)} .up{color:var(--s-available)} .down{color:var(--s-bill)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.quiet{border-color:transparent;background:var(--sunk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--pb,var(--sunk));color:var(--pc,var(--ink2))}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-available{--pb:var(--s-available-bg);--pc:var(--s-available)} .p-occupied{--pb:var(--s-occupied-bg);--pc:var(--s-occupied)}
.p-reserved{--pb:var(--s-reserved-bg);--pc:var(--s-reserved)} .p-ordering{--pb:var(--s-ordering-bg);--pc:var(--s-ordering)}
.p-waiting{--pb:var(--s-waiting-bg);--pc:var(--s-waiting)} .p-bill{--pb:var(--s-bill-bg);--pc:var(--s-bill)} .p-cleaning{--pb:var(--s-cleaning-bg);--pc:var(--s-cleaning)}
.p-new{--pb:var(--s-reserved-bg);--pc:var(--s-reserved)} .p-preparing{--pb:var(--s-ordering-bg);--pc:var(--s-ordering)} .p-ready{--pb:var(--s-available-bg);--pc:var(--s-available)} .p-served{--pb:var(--s-cleaning-bg);--pc:var(--s-cleaning)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2);min-width:0}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0} .row b{font-weight:600} .row .t{font:500 13px var(--mono);color:var(--ink2);width:52px;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--body);flex:none}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.stack{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px;background:var(--surface)}.stack i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.legend i{width:10px;height:10px;border-radius:3px;display:block}
.tasks .row{padding:13px 0}
.task-go{margin-left:auto}

/* floor plan */
.floor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.floor svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.floor.edit svg{touch-action:none;cursor:default}
.fscroll{overflow-x:auto}
.zone{fill:var(--bg);stroke:var(--line);stroke-width:1}
.zone-l{font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;fill:var(--ink3)}
.fx{fill:var(--sunk);stroke:var(--line);stroke-width:1}.fx-l{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink2)}
.tb{cursor:pointer}.tb .sh{stroke-width:1.6;transition:fill .25s,stroke .25s}.tb .ch{fill:var(--line)}
.tb text{pointer-events:none}.tb .n{font:600 15px var(--display);fill:var(--ink)}.tb .m{font:500 10px var(--mono);fill:var(--ink2)}
.tb.sel .sh{stroke-width:3}.tb.dimmed{opacity:.32}
.st-available .sh{fill:var(--s-available-bg);stroke:var(--s-available)} .st-occupied .sh{fill:var(--s-occupied-bg);stroke:var(--s-occupied)}
.st-reserved .sh{fill:var(--s-reserved-bg);stroke:var(--s-reserved)} .st-ordering .sh{fill:var(--s-ordering-bg);stroke:var(--s-ordering)}
.st-waiting .sh{fill:var(--s-waiting-bg);stroke:var(--s-waiting)} .st-bill .sh{fill:var(--s-bill-bg);stroke:var(--s-bill)}
.st-cleaning .sh{fill:var(--s-cleaning-bg);stroke:var(--s-cleaning);stroke-dasharray:5 4}
.st-bill .sh{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:4}}
.floor.edit .tb{cursor:grab}.floor.edit .tb .sh{fill:var(--surface);stroke:var(--ink2)}.floor.edit .tb.sel .sh{stroke:var(--accent)}
.floor-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.insp{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.insp label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.insp input,.insp select,.fld input,.fld textarea{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:500 15px var(--body);min-width:0}
.fld{display:flex;flex-direction:column;gap:6px}.fld textarea{padding:10px 12px;min-height:70px;resize:vertical}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.38);z-index:30;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:in .22s ease}
@keyframes in{from{transform:translateX(24px);opacity:0}}
.sheet>header{padding:20px 22px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:12px}
.sheet>header h2{font-size:26px}.sheet .body{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.sheet>footer{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.x{margin-left:auto;width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.facts div b{display:block;font:500 17px var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:14px;background:var(--surface)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.line{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}.line:first-child{border-top:0}
.line .q{font:500 14px var(--mono);width:28px;flex:none;color:var(--ink2)}.line .p{margin-left:auto;font:500 14px var(--mono);white-space:nowrap}
.line small{display:block;color:var(--ink3);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;font:500 22px var(--display);padding-top:10px;border-top:1px solid var(--line)}

/* order screen */
.order{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dish{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);min-height:118px;transition:border-color .15s,transform .1s}
.dish:hover{border-color:var(--ink3)}.dish:active{transform:scale(.985)}
.dish b{font:500 16px/1.2 var(--display)}.dish small{color:var(--ink3);font-size:12.5px;line-height:1.35;flex:1}
.dish .pr{font:500 14px var(--mono)}.dish.off{opacity:.45;cursor:not-allowed}
.dish .cnt{align-self:flex-start;background:var(--accent);color:var(--on-accent);border-radius:99px;font:600 12px var(--mono);padding:1px 8px}
.ticket{position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.step button{width:46px;height:46px;font-size:20px}.step span{min-width:44px;text-align:center;font:500 18px var(--mono)}

/* kitchen */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kcol>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.kcol h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body);font-weight:600}
.kcol .count{font:500 13px var(--mono);color:var(--ink3)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;border-top:4px solid var(--kc,var(--line))}
.tk.new{--kc:var(--s-reserved)}.tk.preparing{--kc:var(--s-ordering)}.tk.ready{--kc:var(--s-available)}.tk.late{--kc:var(--s-bill)}
.tk header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tk .tn{font:600 26px var(--display)}.tk .on{font:500 13px var(--mono);color:var(--ink3)}
.tk ul{list-style:none;margin:0;padding:0;font:500 16px/1.35 var(--mono)}.tk li{padding:5px 0;border-top:1px dashed var(--line)}.tk li:first-child{border-top:0}
.tk li small{display:block;font-size:13px;color:var(--s-waiting);font-weight:500}
.tk .el{font:500 13px var(--mono);color:var(--ink2)}.tk.late .el{color:var(--s-bill)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink3);font-size:14px}

.userchip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:99px;background:var(--surface);text-align:left}
.userchip:hover{border-color:var(--ink3)}.userchip b{display:block;font-size:14px;line-height:1.2;white-space:nowrap}.userchip small{display:block;font-size:11px;color:var(--ink3);white-space:nowrap}
.signin{grid-column:1/-1;height:100%;overflow:auto;display:flex;justify-content:center;padding:32px 16px}
.si-card{width:min(560px,100%);display:flex;flex-direction:column;gap:22px;margin:auto 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:left;min-width:0}
.person:hover{border-color:var(--accent)}.person b{display:block}.person small{color:var(--ink3);font-size:12.5px}.person span:last-child{min-width:0}
.dots{display:flex;gap:14px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink3)}.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:68px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:500 24px var(--display)}.pad button:active{background:var(--accent-soft)}
.perm{width:100%;border-collapse:collapse;font-size:13.5px;min-width:460px}.perm th{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:8px 6px;text-align:center}
.perm td{padding:9px 6px;border-top:1px solid var(--line2);text-align:center}.perm td:first-child{text-align:left;font-weight:500}.perm .yes{color:var(--accent)}.perm .no{color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:14px}
.soonlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.soonlist div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}.soonlist b{display:block;font:500 16px var(--display);margin-bottom:4px}
.axis{font:500 10px var(--mono);fill:var(--ink3)}

@media (max-width:1060px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line2)}.g2,.g3{grid-template-columns:minmax(0,1fr)}.order{grid-template-columns:minmax(0,1fr)}.ticket{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0;overflow-x:auto;scrollbar-width:none}
  .brand,.rail-foot{display:none}.nav{flex-direction:row;gap:2px}.nav button{flex-direction:column;gap:3px;font-size:11px;padding:8px 12px}.nav .soon{display:none}
  .top{padding:12px 16px}.top h1{font-size:18px;flex-basis:100%;margin:0}.view{padding:16px 16px 28px}
  .kds{grid-template-columns:minmax(0,1fr)}

const RSCALE={day:1,week:6.4,month:27,year:318},RNAME={day:'Today',week:'This week',month:'This month',year:'This year'},RPREV={day:'last Thursday',week:'last week',month:'last month',year:'last year'};
function itemStats(){const c={};MENU.forEach((m,i)=>{c[m.id]=3+(i*7)%19});S.orders.forEach(o=>o.lines.forEach(l=>{c[l.item]+=l.qty}));const k=RSCALE[S.rr];return MENU.map(m=>({m,q:Math.round(c[m.id]*k),v:Math.round(c[m.id]*k*m.price)}))}
function reportsPage(){
  if(LIVE)return reportsLive();

async function authCall(path,body,method,bearer){const r=await fetch(SB_URL+'/auth/v1/'+path,{method:method||'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+(bearer||SB_KEY),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error_code||j.code||j.msg||j.error_description||'ERR');e.code=String(j.error_code||j.error||'').toLowerCase();e.msg=j.msg||j.error_description||j.message||'';throw e}return j}
const ownKeep=j=>ownSave({at:j.access_token,rt:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000,email:(j.user&&j.user.email)||(OWN&&OWN.email)||''});
async function ownJWT(){if(!OWN)throw Object.assign(new Error('AUTH'),{code:'AUTH'});if(Date.now()>OWN.exp){try{ownKeep(await authCall('token?grant_type=refresh_token',{refresh_token:OWN.rt}))}catch(e){ownSave(null);throw Object.assign(new Error('AUTH'),{code:'AUTH'})}}return OWN.at}

  const j=await r.json().catch(()=>null);if(!r.ok){const e=new Error((j&&j.message)||'ERR');e.code=(j&&j.message)||'ERR';throw e}return j}

  tCat(d){S.tcat=d.c;render()},
  tAdd(d){const m=item(d.id);if(!m.on)return toast(m.name+' is sold out');S.basket=S.basket||[];const x=S.basket.find(q=>q.item===m.id);if(x)x.qty++;else S.basket.push({item:m.id,qty:1});render()},
  tQty(d){const x=S.basket[+d.i];if(!x)return;x.qty+=+d.n;if(x.qty<1)S.basket.splice(+d.i,1);render()},
  tClear(){S.basket=[];render()},tGo(){const t=$('.till .ticket');if(t)t.scrollIntoView({behavior:'smooth',block:'start'})},tForNone(){S.tillFor=null;render()},
  async tSell(){if(S.busy||!S.basket.length)return;S.busy=true;try{const tot=r2(basketTotal()),o=await tillPush('counter','Counter'),txid=await nextNo();
      S.tx.push({id:txid,net:tot,guests:0,table:'counter',label:'Counter',total:tot,method:S.payM,by:S.user,at:now(),refunded:false,svc:0,dfac:1,disc:0,part:'',lines:billLinesOf([o]),waiter:S.user});
      if(!LIVE)BASE.rev+=tot;repStale();S.rcpt={tx:txid};toast(`${gbp2(tot)} taken by ${S.payM.toLowerCase()}`)}catch(e){netFail(e);toast('No connection. Nothing was charged, try again.')}finally{S.busy=false}render()},
  async tNewTab(){const nm=($('#tabn').value||'').trim();if(nm.length<1){$('#tabn').focus();return toast('Give the tab a name')}if(S.busy)return;S.busy=true;
    try{const id='tab-'+now().toString(36);S.live[id]={status:'tab',name:nm.slice(0,40),opened:now(),waiter:S.user,guests:0,nosvc:true,note:''};await tillPush(id,nm);toast('Tab started for '+nm)}catch(e){netFail(e)}finally{S.busy=false}render()},
  async tAddTo(d){if(S.busy)return;S.busy=true;try{await tillPush(d.id,S.live[d.id].name);toast('Added to '+S.live[d.id].name+"'s tab")}catch(e){netFail(e)}finally{S.busy=false}render()},
  async tToTab(){const id=S.tillFor;if(!id||S.busy)return;S.busy=true;try{await tillPush(id,S.live[id].name);S.tillFor=null;S.tabSel=id;toast('Added to '+S.live[id].name+"'s tab")}catch(e){netFail(e)}finally{S.busy=false}render()},
  tabOpen(d){S.tabSel=d.id;S.sel=d.id;render();const v=$('#view');if(v)v.scrollTop=0},
  tabBack(){S.tabSel=null;S.sel=null;render()},
  tabMore(){S.tillFor=S.tabSel;S.tabSel=null;S.sel=null;render()},
  async tabPay(){const id=S.tabSel;if(!id||S.busy)return;const os=openOrders(id),t=S.live[id];
    if(!os.length){t.status='closed';S.tabSel=null;S.sel=null;toast('Tab closed');return render()}
    S.busy=true;try{const b=billCalc(id),txid=await nextNo();
      S.tx.push({id:txid,net:b.after,guests:0,table:id,label:'Tab · '+t.name,total:b.total,method:S.payM,by:S.user,at:now(),refunded:false,svc:b.rate,dfac:b.f,disc:b.disc,part:'',lines:billLines(id),waiter:t.waiter});
      os.forEach(o=>{o.closed=true});t.status='closed';if(!LIVE)BASE.rev+=b.after;repStale();S.tabSel=null;S.sel=null;S.rcpt={tx:txid};toast(`${gbp2(b.total)} taken · ${t.name}'s tab closed`)}catch(e){netFail(e);toast('No connection. Nothing was charged, try again.')}finally{S.busy=false}render()}});
function billLinesOf(os){const m=new Map();os.forEach(o=>o.lines.forEach(x=>{if(x.void)return;const k=x.name+'|'+x.price,c=m.get(k)||{name:x.name,qty:0,price:x.price};c.qty+=x.qty;m.set(k,c)}));return[...m.values()]}
/* the owner's dashboard in café & bar mode: open tabs instead of the floor plan */
const ownerHome0=ownerHome;
ownerHome=function(){let h=ownerHome0();if(!isCafe())return h;const tabs=openTabs(),a=h.indexOf('<section class="panel"><header><h2>Tables</h2>');
  if(a>=0){const b=h.indexOf('</section>',h.indexOf('Kitchen right now',a));const rep=`<section class="panel"><header><h2>Open tabs</h2><button class="btn quiet" data-go="till">Till</button></header>${tabs.map(t=>`<div class="row"><div class="grow"><b class="ell">${esc(t.name)}</b><span class="dim" style="font-size:13px">open since ${hhmm(t.opened)}</span></div><span class="mono">${gbp2(tableTotal(t.id))}</span></div>`).join('')||'<div class="empty">No open tabs.</div>'}</section>`;if(b>a)h=h.slice(0,a)+rep+h.slice(b+10)}
  const ot=tabs.reduce((x,t)=>x+tableTotal(t.id),0);
  h=h.replace('Flying out of the kitchen','Selling well today').replace(/sold tonight/g,'sold today')
   .replace(/<div class="kpi"><span class="eyebrow">Covers<\/span>[\s\S]*?<\/small><\/div>/,`<div class="kpi"><span class="eyebrow">Open tabs</span><span class="num">${tabs.length}</span><small>${gbp2(ot)} still to pay</small></div>`)
   .replace(/<section class="panel"><header><h2>Arriving tonight<\/h2>[\s\S]*?<\/section>/,'');
  return h.replace(/\d+ tables seated, \d+ tickets in the kitchen[^.]*/,`${tabs.length} open tab${tabs.length===1?'':'s'}`)};

boot();
setInterval(()=>{const c=$('#clock');if(c)c.textContent=hhmm(now());if(!S.sel&&!S.mod&&!S.edit&&S.page!=='order'&&safe())softRender()},30000);
</script>
